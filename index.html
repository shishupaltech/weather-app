<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌦 Weather App</h1>

    <div class="search-box">
        <input
            type="text"
            id="city"
            placeholder="Enter city name">

        <button id="searchBtn">
            Search
        </button>
    </div>

    <div id="weather">

        <h2 id="cityName"></h2>

        <p id="temperature"></p>

        <div id="weatherInfo">
    <img id="weatherIcon" alt="Weather Icon" style="visibility: hidden;">
    <span id="description"></span>
</div>

        <p id="humidity"></p>

        <p id="wind"></p>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
